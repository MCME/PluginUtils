plugins {
    // java-library (not plain java) for the `api` configuration json-simple needs below.
    id 'java-library'
    id 'maven-publish'
    id 'io.papermc.paperweight.userdev' version '2.0.0-SNAPSHOT'
}

group = 'com.mcmiddleearth'
version = '2.0.5-SNAPSHOT'

repositories {
    // For the tests only: MockBukkit, the paper-api it runs against and their dependencies come from the local
    // Maven repository when another project has already fetched them there, so the tests also run offline.
    // CI finds them in the repositories below.
    mavenLocal {
        content {
            onlyForConfigurations 'testCompileClasspath', 'testRuntimeClasspath'
        }
    }
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://libraries.minecraft.net') }
    maven { url = uri('https://maven.enginehub.org/repo/') }
    maven { url = uri('https://repo.mikeprimm.com') }
}

dependencies {
    // Provides paper-api + the CraftBukkit/NMS classes from PaperMC's published dev-bundle.
    // Replaces the old hard-coded <systemPath> craftbukkit jar — nothing local required.
    paperweight.paperDevBundle('26.2.build.111-stable')

    compileOnly 'com.google.guava:guava:33.3.1-jre'
    compileOnly 'com.sk89q.worldedit:worldedit-core:7.3.0'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.0'
    // '@jar' forces the main artifact and ignores dynmap's Gradle module metadata, which otherwise
    // selects an 'unshaded' variant that is missing the org.dynmap.* API classes.
    compileOnly 'us.dynmap:dynmap-api:3.3-beta-5@jar'
    compileOnly 'com.mojang:authlib:3.13.56'
    compileOnly 'org.bstats:bstats-bukkit:3.1.0'

    // Declared as api, not compileOnly, so it reaches the published POM and Gradle module:
    // JSONUtil takes and returns JSONObject, and MessageUtil cannot be linked without it, so a
    // consumer testing with MockBukkit hit NoClassDefFoundError: org/json/simple/parser/ParseException.
    // The server ships json-simple 1.1.1 and this build does not shade, so it is never bundled; and
    // consumers declare PluginUtils provided/compileOnly, which keeps it out of their jars too.
    // Not `provided` in the POM: Maven drops a dependency's provided dependencies, so no consumer
    // would ever see it.
    api('com.googlecode.json-simple:json-simple:1.1.1') {
        // json-simple 1.1.1's own POM wrongly declares junit 4.10 at compile scope.
        exclude group: 'junit', module: 'junit'
    }

    // The tests run on MockBukkit's mock server. It needs a paper-api of the same Minecraft version (26.2) on the
    // test classpath, and brings JUnit 6 (JUnit Jupiter) with it. paper-api build 126 rather than the dev bundle's
    // 111: the same Minecraft version and Adventure (5.2.0), and the build MCME-PvP's tests already run MockBukkit
    // 4.116.1 with, so it is in the local Maven repository for offline builds.
    testImplementation 'io.papermc.paper:paper-api:26.2.build.126-stable'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v26.2:4.116.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

paperweight {
    // Only for compiling. The server jar registers its own registry and Adventure service providers, which would
    // clash with MockBukkit's in the tests, so they get paper-api (above) instead of the server.
    addServerDependencyTo = [configurations.compileOnly]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// The plugin.yml still uses Maven-style ${project.artifactId}/${project.version} tokens; substitute
// them at build time (Gradle does not do Maven resource filtering) so Paper gets a valid name.
processResources {
    def pluginVersion = version.toString()
    // Gradle cannot see a value captured by the filter closure below, so declare it: otherwise a version
    // bump leaves this task UP-TO-DATE and the jar ships the previous version's plugin.yml.
    inputs.property('version', pluginVersion)
    filesMatching('plugin.yml') {
        filter { line ->
            line.replace('${project.artifactId}', 'PluginUtils').replace('${project.version}', pluginVersion)
        }
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    // Publish to MCME's own Reposilite, so consumers resolve this as
    // com.mcmiddleearth:PluginUtils - the same coordinates the 1.9.x line already uses there,
    // and the same groupId this build declares above.
    //
    // Without a publish target the only distribution channel was JitPack, and JitPack derives
    // the groupId from the GitHub org rather than from `group` above: consumers got
    // com.github.MCME:PluginUtils instead. Maven treats a differing groupId as an unrelated
    // artifact, so a project depending on both this and something that still pulls
    // com.mcmiddleearth:PluginUtils ended up with two copies on the classpath and no version
    // conflict resolution between them. Publishing here keeps one coordinate for one library.
    //
    // Credentials come from the MCME_MAVEN_NAME / MCME_MAVEN_SECRET org secrets in CI, or the
    // same-named environment variables locally. Absent those, `publish` fails and every other
    // task (build, test, publishToMavenLocal) is unaffected.
    repositories {
        maven {
            name = 'mcme'
            url = uri(version.toString().endsWith('SNAPSHOT')
                    ? 'https://repo.mcmiddleearth.com/snapshots'
                    : 'https://repo.mcmiddleearth.com/releases')
            credentials {
                username = System.getenv('MCME_MAVEN_NAME')
                password = System.getenv('MCME_MAVEN_SECRET')
            }
        }
    }
}
