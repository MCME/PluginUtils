name: build

on:
  push:
    branches: [pluginutils-26.2, master, development]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # paperweight-userdev resolves the NMS/CraftBukkit classes from PaperMC's
      # published dev-bundle, so this needs nothing local — it builds on any runner.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
