name: build

on:
  push:
    branches: [pluginutils-26.2, master, development]
    # This project tags releases bare (2.0.0, 2.0.1, 2.0.2); v1.2 is an older style.
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  # Publishing is a deliberate act, so it is reachable from the Actions tab
  # ("Run workflow") rather than riding along with every push.
  workflow_dispatch:

jobs:
  build:
    # Pinned, not ubuntu-latest: a new runner image should arrive as a commit that CI tested,
    # not overnight (ubuntu-latest moves to 26.04 from 2026-10-19 on).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # v5, not v6: v6 moves the caching into a proprietary component, and upgrading accepts
      # its terms of use (https://blog.gradle.org/github-actions-for-gradle-v6).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # paperweight-userdev resolves the NMS/CraftBukkit classes from PaperMC's
      # published dev-bundle, so this needs nothing local — it builds on any runner.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # Publishes com.mcmiddleearth:PluginUtils to repo.mcmiddleearth.com - snapshots or
      # releases is chosen by the version suffix in build.gradle. Deliberately NOT run on
      # ordinary pushes: trigger it manually, or by pushing a release tag (bare, like 2.0.5).
      - name: Publish to repo.mcmiddleearth.com
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: ./gradlew publish --no-daemon --stacktrace
        env:
          MCME_MAVEN_NAME: ${{ secrets.MCME_MAVEN_NAME }}
          MCME_MAVEN_SECRET: ${{ secrets.MCME_MAVEN_SECRET }}
