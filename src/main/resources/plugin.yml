name: ${project.artifactId}
main: com.mcmiddleearth.pluginutil.PluginUtilsPlugin
version: ${project.version}
author: Eriol_Eandur
load: STARTUP
softdepend: [ProtocolLib,Essentials,WorldEdit,dynmap]
api-version: 1.21
# Paper reads the mappings namespace from the jar manifest, not from plugin.yml.

commands:
    dev:
        description: Send a plugin's debug output to you in chat, or to the console
        usage: /dev <plugin> [true | false | <level> | r]
    
permissions:
    pluginutil.developer:
        description: Allows use of /dev to toggle plugin debug output
        default: op
